name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Sett opp Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installer dependencies
        run: python -m pip install -e ".[dev]"

      - name: Kjør Ruff
        run: ruff check .

      - name: Kjør pytest
        run: pytest -v